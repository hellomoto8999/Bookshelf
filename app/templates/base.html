<!DOCTYPE html>
<html lang="en" data-theme="light" data-theme-mode="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Bookshelf{% endblock %}</title>
  <meta name="theme-color" content="#f4f4f1">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      try {
        var mode = localStorage.getItem('bookshelf-theme') || 'system';
        var dark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme-mode', mode);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <a class="sr-only" href="#content">Skip to content</a>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="/">
        <svg viewBox="0 0 48 48" aria-label="Bookshelf logo" class="brand-mark" fill="none">
          <rect x="6" y="10" width="8" height="28" rx="2" fill="currentColor"></rect>
          <rect x="18" y="6" width="8" height="32" rx="2" fill="currentColor" opacity=".88"></rect>
          <rect x="30" y="14" width="12" height="24" rx="2" fill="currentColor" opacity=".72"></rect>
        </svg>
        <span>Bookshelf</span>
      </a>
      <div class="theme-menu" data-theme-menu>
        <button class="theme-toggle" data-theme-toggle aria-label="Theme" aria-haspopup="true" aria-expanded="false"></button>
        <div class="theme-panel" role="menu" aria-label="Theme">
          <button type="button" class="theme-item" role="menuitemradio" data-theme-choice="light">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2M12 20.5v2M4.4 4.4l1.4 1.4M18.2 18.2l1.4 1.4M1.5 12h2M20.5 12h2M4.4 19.6l1.4-1.4M18.2 5.8l1.4-1.4"/></svg>
            <span>Light</span>
          </button>
          <button type="button" class="theme-item" role="menuitemradio" data-theme-choice="dark">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <span>Dark</span>
          </button>
          <button type="button" class="theme-item" role="menuitemradio" data-theme-choice="system">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2.5" y="4" width="19" height="13" rx="1.5"/><path d="M8 20.5h8M12 17v3.5"/></svg>
            <span>Follow OS</span>
          </button>
        </div>
      </div>
    </div>
  </header>
  <main id="content" class="container page-shell">
    {% block content %}{% endblock %}
  </main>
  <script>
    (() => {
      const root = document.documentElement;
      const menu = document.querySelector('[data-theme-menu]');
      const button = document.querySelector('[data-theme-toggle]');
      const items = Array.from(document.querySelectorAll('[data-theme-choice]'));
      const storageKey = 'bookshelf-theme';
      const media = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

      const ICONS = {
        light: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2M12 20.5v2M4.4 4.4l1.4 1.4M18.2 18.2l1.4 1.4M1.5 12h2M20.5 12h2M4.4 19.6l1.4-1.4M18.2 5.8l1.4-1.4"/></svg>',
        dark: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
        system: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2.5" y="4" width="19" height="13" rx="1.5"/><path d="M8 20.5h8M12 17v3.5"/></svg>',
      };
      const META = { light: '#f4f4f1', dark: '#141414' };
      const LABEL = { light: 'Light', dark: 'Dark', system: 'Follow OS' };
      const valid = (m) => m === 'light' || m === 'dark' || m === 'system';

      const getMode = () => {
        try {
          const v = localStorage.getItem(storageKey);
          return valid(v) ? v : 'system';
        } catch (e) { return 'system'; }
      };
      const setMode = (m) => {
        try { localStorage.setItem(storageKey, m); } catch (e) {}
      };
      const resolve = (mode) => mode === 'system' ? ((media && media.matches) ? 'dark' : 'light') : mode;

      const apply = (mode) => {
        const effective = resolve(mode);
        root.setAttribute('data-theme', effective);
        root.setAttribute('data-theme-mode', mode);
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', META[effective] || META.light);
        if (button) {
          button.innerHTML = ICONS[mode];
          button.setAttribute('aria-label', 'Theme: ' + LABEL[mode]);
          button.setAttribute('title', 'Theme: ' + LABEL[mode]);
        }
        items.forEach((el) => {
          const on = el.getAttribute('data-theme-choice') === mode;
          el.classList.toggle('is-active', on);
          el.setAttribute('aria-checked', on ? 'true' : 'false');
        });
      };

      const open = (v) => {
        if (!menu) return;
        menu.classList.toggle('is-open', v);
        if (button) button.setAttribute('aria-expanded', v ? 'true' : 'false');
      };

      let mode = getMode();
      apply(mode);

      if (button) {
        button.addEventListener('click', (e) => {
          e.stopPropagation();
          open(!menu.classList.contains('is-open'));
        });
      }
      items.forEach((el) => {
        el.addEventListener('click', () => {
          mode = el.getAttribute('data-theme-choice');
          setMode(mode);
          apply(mode);
          open(false);
        });
      });
      document.addEventListener('click', (e) => {
        if (menu && !menu.contains(e.target)) open(false);
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') open(false);
      });

      if (media) {
        media.addEventListener('change', () => {
          if (getMode() === 'system') apply('system');
        });
      }
    })();
  </script>
</body>
</html>
